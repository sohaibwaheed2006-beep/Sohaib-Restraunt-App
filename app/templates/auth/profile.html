{% extends "base.html" %}

{% block title %}My Profile{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 600px;">
    <h2 style="margin-bottom: 30px;"><i class="fas fa-user-circle"></i> My Profile</h2>
    
    <form method="POST" action="{{ url_for('auth.profile') }}">
        <div class="form-group">
            <label>Email Address</label>
            <input type="text" class="form-control" value="{{ current_user.email }}" disabled style="background: rgba(255,255,255,0.05); color: #888;">
            <small style="color: var(--text-muted);">Email cannot be changed.</small>
        </div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" required value="{{ current_user.username }}">
        </div>
        
        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone" class="form-control" value="{{ current_user.phone or '' }}">
        </div>
        
        <div class="form-group">
            <label for="address">Default Delivery Address</label>
            <textarea id="address" name="address" class="form-control" rows="4">{{ current_user.address or '' }}</textarea>
        </div>
        
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> Save Changes
        </button>
    </form>
</div>
{% endblock %}
