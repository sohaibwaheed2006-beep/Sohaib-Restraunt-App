{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="form-container">
    <h2 style="text-align: center; margin-bottom: 20px; font-size: 2rem;">Welcome Back!</h2>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 30px;">Sign in to continue to Sohaib Restaurant</p>
    
    <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" required placeholder="you@example.com">
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required placeholder="Enter your password">
        </div>
        
        <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
            <input type="checkbox" id="remember" name="remember" style="width: 16px; height: 16px; accent-color: var(--primary);">
            <label for="remember" style="margin-bottom: 0;">Remember me</label>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
            <i class="fas fa-sign-in-alt"></i> Login
        </button>
    </form>
    
    <div style="text-align: center; margin-top: 25px; color: var(--text-muted);">
        <p>Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--primary); font-weight: bold;">Sign up here</a></p>
    </div>
</div>
{% endblock %}
